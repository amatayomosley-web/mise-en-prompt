[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mise-en-prompt"
version = "0.0.1"
description = "A culinary agent that grounds dish design in regional cooking knowledge."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "amatayomosley-web", email = "amatayomosley@gmail.com" },
]
keywords = ["claude-code", "agent", "cooking", "culinary", "recipe"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Other/Nonlisted Topic",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/amatayomosley-web/mise-en-prompt"
Issues = "https://github.com/amatayomosley-web/mise-en-prompt/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mise_en_prompt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
